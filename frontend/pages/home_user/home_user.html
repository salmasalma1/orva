<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Home - ORVA</title>

<!-- AOS Animation Library -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    position: relative;
    overflow-x: hidden;
  }

  /* Animated Background */
  .bg-animation {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
  }

  .bg-animation span {
    position: absolute;
    display: block;
    width: 20px;
    height: 20px;
    background: rgba(255, 255, 255, 0.1);
    animation: float 25s infinite;
    bottom: -150px;
  }

  .bg-animation span:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
  .bg-animation span:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
  .bg-animation span:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
  .bg-animation span:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
  .bg-animation span:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
  .bg-animation span:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
  .bg-animation span:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
  .bg-animation span:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }

  @keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
    100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
  }

  /* Navigation Bar */
  nav {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 15px;
    padding: 20px 40px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
  }

  #logo {
    position: absolute;
    left: 40px;
    font-size: 1.8rem;
    font-weight: 800;
    color: #ffd700;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #logo i {
    font-size: 2rem;
  }

  nav #search {
    padding: 12px 20px;
    border-radius: 50px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1);
    color: white;
    width: 280px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    transition: all 0.3s;
  }

  nav #search::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }

  nav #search:focus {
    outline: none;
    border-color: #ffd700;
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
  }

  nav .nav-btn {
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 10px 20px;
    border-radius: 50px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s;
  }

  nav .nav-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  nav .nav-btn.active {
    background: linear-gradient(45deg, #ffd700, #ffed4e);
    color: #333;
    border-color: #ffd700;
    box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
  }

  /* Content Area */
  #content {
    padding: 40px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .tab h2 {
    color: white;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 30px;
    text-align: center;
  }

  /* Cards */
  #mechanic-list .card,
  #pending-list .card,
  #request-list .card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    padding: 25px;
    margin: 20px 0;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    transition: all 0.3s;
    color: white;
  }

  #mechanic-list .card:hover,
  #pending-list .card:hover,
  #request-list .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    background: rgba(255, 255, 255, 0.15);
  }

  .card h3 {
    color: #ffd700;
    font-size: 1.3rem;
    margin-bottom: 10px;
  }

  .card p {
    color: rgba(255, 255, 255, 0.9);
    margin: 8px 0;
    font-size: 14px;
  }

  .card strong {
    color: #ffed4e;
  }

  .card button {
    padding: 12px 24px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    margin-top: 15px;
    margin-right: 10px;
    transition: all 0.3s;
  }

  .card .request-btn {
    background: linear-gradient(45deg, #28a745, #20c997);
    color: white;
    box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
  }

  .card .request-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(40, 167, 69, 0.5);
  }

  .card .cancel-btn {
    background: linear-gradient(45deg, #dc3545, #c82333);
    color: white;
    box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
  }

  .card .cancel-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(220, 53, 69, 0.5);
  }

  .card .review-btn {
    background: linear-gradient(45deg, #ffd700, #ffed4e);
    color: #333;
    box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
  }

  .card .review-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 215, 0, 0.5);
  }

  .card .remove-btn {
    background: rgba(108, 117, 125, 0.8);
    color: white;
  }

  .card .remove-btn:hover {
    background: rgba(108, 117, 125, 1);
    transform: translateY(-2px);
  }

  .card .request-add-btn {
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: white;
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
  }

  .card .request-add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
  }

  /* Profile Form */
  #profile-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 500px;
    margin: 40px auto;
    padding: 40px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    align-items: center;
    position: relative;
  }

  .edit-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: linear-gradient(45deg, #ffd700, #ffed4e);
    color: #333;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .edit-btn:hover {
    transform: translateY(-3px) rotate(15deg);
    box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
  }

  .save-btn {
    background: linear-gradient(45deg, #28a745, #20c997);
    color: white;
    padding: 14px 40px;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
    transition: all 0.3s;
    margin-top: 10px;
    display: none;
  }

  .save-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(40, 167, 69, 0.6);
  }

  .save-btn.show {
    display: block;
  }

  #profile-form input {
    width: 100%;
    padding: 14px 20px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.1);
    color: white;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    transition: all 0.3s;
  }

  #profile-form input::placeholder {
    color: rgba(255, 255, 255, 0.5);
  }

  #profile-form input:not(:disabled) {
    background: rgba(255, 255, 255, 0.2);
    border-color: #ffd700;
  }

  #profile-form input:not(:disabled):focus {
    outline: none;
    border-color: #ffed4e;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
  }

  #profile-pic {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
    border: 4px solid #ffd700;
    box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
    cursor: pointer;
    transition: all 0.3s;
  }

  #profile-pic:hover {
    transform: scale(1.05);
    box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
  }

  .photo-upload-wrapper {
    position: relative;
    display: inline-block;
  }

  .photo-upload-label {
    position: absolute;
    bottom: 0;
    right: 0;
    background: linear-gradient(45deg, #ffd700, #ffed4e);
    color: #333;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
    transition: all 0.3s;
    opacity: 0;
  }

  .photo-upload-wrapper:hover .photo-upload-label {
    opacity: 1;
  }

  .photo-upload-label:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 20px rgba(255, 215, 0, 0.6);
  }

  #profile-photo-input {
    display: none;
  }

  /* Contact Footer */
  #contact-footer {
    margin-top: 50px;
    padding: 40px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }

  #contact-footer h3 {
    color: #ffd700;
    font-size: 1.8rem;
    margin-bottom: 25px;
  }

  .contact-links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }

  .contact-links a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 20px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s;
  }

  .contact-links a:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: #ffd700;
    transform: translateY(-3px);
    box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
  }

  .contact-links img {
    width: 24px;
    height: 24px;
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(255, 255, 255, 0.7);
  }

  .empty-state i {
    font-size: 4rem;
    color: rgba(255, 255, 255, 0.3);
    margin-bottom: 20px;
  }

  .empty-state p {
    font-size: 1.2rem;
  }

  /* Modal Base */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    padding: 40px;
    border-radius: 30px;
    width: 90%;
    max-width: 550px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .modal-content h3 {
    margin-bottom: 25px;
    color: #667eea;
    text-align: center;
    font-size: 1.8rem;
    font-weight: 700;
  }

  .modal-content p {
    color: #333;
    margin-bottom: 15px;
  }

  .modal-content label {
    color: #555;
    font-weight: 600;
    display: block;
    margin-bottom: 8px;
    margin-top: 15px;
  }

  .modal-content textarea,
  .modal-content select,
  .modal-content input {
    width: 100%;
    padding: 14px 20px;
    margin: 10px 0;
    border: 2px solid rgba(102, 126, 234, 0.3);
    border-radius: 15px;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s;
  }

  .modal-content textarea:focus,
  .modal-content input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
  }

  .modal-content textarea {
    height: 120px;
    resize: vertical;
  }

  .modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 15px;
    margin-top: 25px;
  }

  .modal-buttons button {
    padding: 12px 30px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    transition: all 0.3s;
  }

  .btn-send {
    background: linear-gradient(45deg, #28a745, #20c997);
    color: white;
    box-shadow: 0 5px 20px rgba(40, 167, 69, 0.3);
  }

  .btn-send:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(40, 167, 69, 0.5);
  }

  .btn-cancel {
    background: linear-gradient(45deg, #dc3545, #c82333);
    color: white;
    box-shadow: 0 5px 20px rgba(220, 53, 69, 0.3);
  }

  .btn-cancel:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(220, 53, 69, 0.5);
  }

  .btn-review {
    background: linear-gradient(45deg, #ffd700, #ffed4e);
    color: #333;
    box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
  }

  .btn-review:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255, 215, 0, 0.5);
  }

  /* Star rating */
  .star-rating {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 20px 0;
  }

  .star {
    font-size: 2.5rem;
    cursor: pointer;
    color: #ddd;
    transition: all 0.2s;
  }

  .star:hover,
  .star.selected {
    color: #ffd700;
    transform: scale(1.2);
  }

  /* Chat Modal */
  #chat-modal .modal-content {
    max-width: 600px;
    height: 70vh;
    max-height: 600px;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
  }

  .chat-header {
    padding: 20px 30px;
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 30px 30px 0 0;
  }

  .chat-header h3 {
    margin: 0;
    color: white;
    font-size: 1.5rem;
  }

  .chat-close {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }

  .chat-close:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: rotate(90deg);
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .message {
    display: flex;
    gap: 10px;
    max-width: 70%;
    animation: messageSlide 0.3s ease;
  }

  @keyframes messageSlide {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .message.sent {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .message.received {
    align-self: flex-start;
  }

  .message-avatar {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    flex-shrink: 0;
  }

  .message-content {
    background: #f0f0f0;
    padding: 12px 16px;
    border-radius: 18px;
    color: #333;
    word-wrap: break-word;
  }

  .message.sent .message-content {
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: white;
  }

  .message-time {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
  }

  .chat-input-area {
    padding: 20px;
    background: rgba(255, 255, 255, 0.95);
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    display: flex;
    gap: 10px;
    border-radius: 0 0 30px 30px;
  }

  .chat-input {
    flex: 1;
    padding: 12px 20px;
    border: 2px solid rgba(102, 126, 234, 0.3);
    border-radius: 25px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    resize: none;
    max-height: 100px;
  }

  .chat-input:focus {
    outline: none;
    border-color: #667eea;
  }

  .chat-send-btn {
    background: linear-gradient(45deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    flex-shrink: 0;
  }

  .chat-send-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
  }

  .chat-send-btn:active {
    transform: scale(0.95);
  }

  .chat-loading {
    text-align: center;
    padding: 20px;
    color: #999;
  }

  .typing-indicator {
    display: flex;
    gap: 5px;
    padding: 10px 15px;
    background: #f0f0f0;
    border-radius: 18px;
    width: fit-content;
  }

  .typing-indicator span {
    width: 8px;
    height: 8px;
    background: #999;
    border-radius: 50%;
    animation: typing 1.4s infinite;
  }

  .typing-indicator span:nth-child(2) {
    animation-delay: 0.2s;
  }

  .typing-indicator span:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes typing {
    0%, 60%, 100% {
      transform: translateY(0);
    }
    30% {
      transform: translateY(-10px);
    }
  }

  /* Responsive */
  @media (max-width: 768px) {
    nav {
      flex-wrap: wrap;
      padding: 15px 20px;
    }

    #logo {
      position: relative;
      left: 0;
      width: 100%;
      justify-content: center;
      margin-bottom: 15px;
    }

    nav #search {
      width: 100%;
      margin: 10px 0;
    }

    .contact-links {
      grid-template-columns: 1fr;
    }

    #content {
      padding: 20px;
    }
  }
</style>
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-animation">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <nav data-aos="fade-down">
    <div id="logo">
      <i class="fas fa-car"></i>
      <p>ORVA</p>
    </div>
    <input type="text" id="search" placeholder=" Search mechanics…">
    <button class="nav-btn active" data-tab="home"><i class="fas fa-home"></i> Home</button>
    <button class="nav-btn" data-tab="pending"><i class="fas fa-clock"></i> Pending</button>
    <button class="nav-btn" data-tab="requests"><i class="fas fa-history"></i> History</button>
    <button class="nav-btn" data-tab="profile"><i class="fas fa-user"></i> Profile</button>
  </nav>

  <div id="content">
    <!-- Home Tab -->
    <div class="tab" id="home-tab">
      <h2 data-aos="fade-up"><i class="fas fa-wrench"></i> Nearest Mechanics</h2>
      <div id="mechanic-list"></div>
    </div>

    <!-- Pending Requests Tab -->
    <div class="tab" id="pending-tab" style="display:none;">
      <h2 data-aos="fade-up"><i class="fas fa-clock"></i> Pending Requests</h2>
      <div id="pending-list"></div>
    </div>

    <!-- History Requests Tab -->
    <div class="tab" id="requests-tab" style="display:none;">
      <h2 data-aos="fade-up"><i class="fas fa-history"></i> Your History Requests</h2>
      <div id="request-list"></div>
    </div>

    <!-- Profile Tab -->
    <div class="tab" id="profile-tab" style="display:none;">
      <h2 data-aos="fade-up"><i class="fas fa-user-circle"></i> Your Profile</h2>
      <form id="profile-form" data-aos="zoom-in" data-aos-delay="100">
        <button type="button" class="edit-btn" id="edit-profile-btn" title="Edit Profile">
          <i class="fas fa-pencil-alt"></i>
        </button>
        <div class="photo-upload-wrapper" data-aos="flip-down" data-aos-delay="200">
          <img id="profile-pic" src="default-profile.png" alt="Profile Picture">
          <label for="profile-photo-input" class="photo-upload-label" title="Change Photo">
            <i class="fas fa-camera"></i>
          </label>
          <input type="file" id="profile-photo-input" accept="image/*">
        </div>
        <input disabled id="profile-name" type="text" placeholder="Full Name" data-aos="fade-right" data-aos-delay="300">
        <input disabled id="profile-age" type="number" placeholder="Age" data-aos="fade-right" data-aos-delay="350">
        <input disabled id="profile-email" type="email" placeholder="Email" readonly data-aos="fade-right" data-aos-delay="400">
        <input disabled id="profile-phone" type="text" placeholder="Phone" data-aos="fade-right" data-aos-delay="450">
        <input disabled id="profile-vehicle" type="text" placeholder="Vehicle Type" data-aos="fade-right" data-aos-delay="500">
        <input disabled id="profile-address" type="text" placeholder="Address" data-aos="fade-right" data-aos-delay="550">
        <button type="button" class="save-btn" id="save-profile-btn">
          <i class="fas fa-save"></i> Save Changes
        </button>
      </form>

      <!-- Contact Us Footer -->
      <footer id="contact-footer" data-aos="fade-up" data-aos-delay="200">
        <h3><i class="fas fa-envelope"></i> Contact Us</h3>
        <div class="contact-links">
          <a href="mailto:contact@example.com" data-aos="fade-up" data-aos-delay="300"><img src="../../images/icons/email.jpg" alt=""> Email</a>
          <a href="tel:+200000000000" data-aos="fade-up" data-aos-delay="350"><img src="../../images/icons/WhatsApp.png" alt=""> WhatsApp</a>
          <a href="https://instagram.com/" data-aos="fade-up" data-aos-delay="400"><img src="../../images/icons/instagram.png" alt=""> Instagram</a>
          <a href="https://linkedin.com/" data-aos="fade-up" data-aos-delay="450"><img src="../../images/icons/linkedin.png" alt=""> LinkedIn</a>
          <a href="https://github.com/" data-aos="fade-up" data-aos-delay="500"><img src="../../images/icons/github.png" alt=""> GitHub</a>
          <a href="https://facebook.com/" data-aos="fade-up" data-aos-delay="550"><img src="../../images/icons/facebook.png" alt=""> Facebook</a>
        </div>
      </footer>
    </div>
  </div>

  <!-- Request Modal -->
  <div id="request-modal" class="modal">
    <div class="modal-content">
      <h3>Send Service Request</h3>
      <p><strong>Mechanic:</strong> <span id="modal-mechanic-name"></span></p>
      <label>Issue Description</label>
      <textarea id="issue-description" placeholder="Describe your vehicle issue..." required></textarea>
      <label>Offered Payment Amount (EGP)</label>
      <input type="number" id="payment-amount" placeholder="e.g. 800" min="100" required>
      <div class="modal-buttons">
        <button class="btn-cancel" id="modal-cancel">Cancel</button>
        <button class="btn-send" id="modal-send">Send Request</button>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div id="review-modal" class="modal">
    <div class="modal-content">
      <h3>Rate & Review Mechanic</h3>
      <p><strong>Mechanic:</strong> <span id="review-mechanic-name"></span></p>
      <label>Your Review</label>
      <textarea id="review-text" placeholder="Share your experience..." required></textarea>
      <label>Rating</label>
      <div class="star-rating">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>
      <div class="modal-buttons">
        <button class="btn-cancel" id="review-cancel">Cancel</button>
        <button class="btn-send" id="review-submit">Submit Review</button>
      </div>
    </div>
  </div>

  <!-- Chat Modal -->
  <div id="chat-modal" class="modal">
    <div class="modal-content">
      <div class="chat-header">
        <h3><i class="fas fa-comments"></i> <span id="chat-mechanic-name"></span></h3>
        <button class="chat-close" id="chat-close"><i class="fas fa-times"></i></button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-loading">Loading messages...</div>
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chat-input" placeholder="Type your message..." rows="1"></textarea>
        <button class="chat-send-btn" id="chat-send-btn">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- AOS Animation Script -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 800,
      easing: 'ease-in-out',
      once: true
    });
  </script>

  <script src="home_user.js" defer></script>
</body>
</html>
