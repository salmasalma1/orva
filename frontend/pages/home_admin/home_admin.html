<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - ORVA</title>
<link rel="stylesheet" href="home_admin.css">
<style>
  /* Modal Styles - Same as home_user */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
  }
  .modal-content {
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
  }
  .modal-content h3 {
    margin-bottom: 20px;
    color: #007bff;
  }
  .modal-content p {
    margin: 10px 0;
    font-size: 1.1rem;
  }
  .profile-img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin: 15px auto;
    border: 4px solid #007bff;
  }
  .modal-buttons {
    margin-top: 25px;
    display: flex;
    gap: 15px;
    justify-content: center;
  }
  .modal-buttons button {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-close { background: #6c757d; color: white; }
  .btn-block { background: #dc3545; color: white; }
</style>
</head>
<body>

  <nav>
    <div id="logo"><p>ORVA Admin</p></div>
    <button class="nav-btn active" data-tab="users">All Users</button>
    <button class="nav-btn" data-tab="mechanics">All Mechanics</button>
    <button class="nav-btn" data-tab="requests">All Requests</button>
    <button class="nav-btn" id="logout-btn">Logout</button>
  </nav>

  <div id="content">

    <!-- Users Tab -->
    <div class="tab" id="users-tab">
      <h2>All Users</h2>
      <div id="users-list"></div>
    </div>

    <!-- Mechanics Tab -->
    <div class="tab" id="mechanics-tab" style="display:none;">
      <h2>All Mechanics</h2>
      <div id="mechanics-list"></div>
    </div>

    <!-- Requests Tab -->
    <div class="tab" id="requests-tab" style="display:none;">
      <h2>All Service Requests</h2>
      <div id="requests-list"></div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal">
    <div class="modal-content">
      <h3>Confirm Delete</h3>
      <p>Are you sure you want to delete this <span id="delete-type"></span>?</p>
      <p><strong>Name:</strong> <span id="delete-name"></span></p>
      <p style="color: #dc3545; font-weight: bold;">This action cannot be undone!</p>
      
      <div class="modal-buttons">
        <button class="btn-close" id="delete-cancel">Cancel</button>
        <button class="btn-block" id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="home_admin.js" defer></script>
</body>
</html>
